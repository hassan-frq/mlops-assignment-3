x-airflow: &airflow
  build: ./airflow
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-assignment-demo
    PYTHONPATH: /opt/airflow/project
    API_RELOAD_URL: http://api:5000/reload
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/project/src:ro
    - ./data/airflow:/opt/airflow/data
    - ./models:/app/models
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow-init:
    <<: *airflow
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  webserver:
    <<: *airflow
    command: webserver
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  api:
    image: ghcr.io/hassan-frq/mlops-assignment-3/btc-forecast-api:sha-f2fdd72
    environment:
      MODEL_ARTIFACT_PATH: /app/models/forecast.json
    volumes:
      - ./models:/app/models:ro
    ports: ["127.0.0.1:5000:5000"]
    restart: on-failure

volumes:
  airflow-db:
  airflow-logs:

# k8s/secret.yaml — Sensitive credentials for the BTC-USD forecast API.
#
# IMPORTANT: Do NOT commit real values. Replace the base64 placeholders with
#   echo -n 'your-value' | base64
# or use Sealed Secrets / External Secrets Operator in production.
#
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
  labels:
    app: btc-forecast
    component: api
type: Opaque
data:
  # Base64-encoded API key used for the /reload admin endpoint.
  # Default placeholder: "changeme"  →  echo -n 'changeme' | base64
  RELOAD_API_KEY: Y2hhbmdlbWU=
  # Base64-encoded secret for signing internal JWT tokens (optional).
  # Default placeholder: "jwt-secret-placeholder"
  JWT_SECRET: and0LXNlY3JldC1wbGFjZWhvbGRlcg==

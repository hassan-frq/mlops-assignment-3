# k8s/configmap.yaml — Non-sensitive application configuration for the BTC-USD forecast API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  labels:
    app: btc-forecast
    component: api
data:
  # Path where the shared PVC exposes the trained model artifact
  MODEL_ARTIFACT_PATH: "/app/models/forecast.json"
  # Gunicorn tuning exposed as env vars (read by gunicorn.conf.py)
  WORKERS: "2"
  TIMEOUT: "120"
  LOG_LEVEL: "info"
  MODEL_STAGE: "production"
  PORT: "5000"
  # Default forecast window (overridden per-request via ?forecast_days=N)
  DEFAULT_FORECAST_DAYS: "7"
---
# k8s/secret.yaml — Sensitive credentials for the BTC-USD forecast API.
#
# IMPORTANT: Do NOT commit real values. Replace the base64 placeholders with
#   echo -n 'your-value' | base64
# or use Sealed Secrets / External Secrets Operator in production.
#
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
  labels:
    app: btc-forecast
    component: api
type: Opaque
data:
  # Base64-encoded API key used for the /reload admin endpoint.
  # Default placeholder: "changeme"  →  echo -n 'changeme' | base64
  RELOAD_API_KEY: Y2hhbmdlbWU=
  # Base64-encoded secret for signing internal JWT tokens (optional).
  # Default placeholder: "jwt-secret-placeholder"
  JWT_SECRET: and0LXNlY3JldC1wbGFjZWhvbGRlcg==

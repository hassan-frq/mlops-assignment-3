# k8s/service.yaml — ClusterIP service for the forecast API.
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api
  labels:
    app: btc-forecast
    component: api
spec:
  selector:
    app: btc-forecast
    component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP


# k8s/configmap.yaml — Non-sensitive application configuration for the BTC-USD forecast API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  labels:
    app: btc-forecast
    component: api
data:
  # Path where the shared PVC exposes the trained model artifact
  MODEL_ARTIFACT_PATH: "/app/models/forecast.json"
  # Gunicorn tuning exposed as env vars (read by gunicorn.conf.py)
  WORKERS: "2"
  TIMEOUT: "120"
  LOG_LEVEL: "info"
  # Default forecast window (overridden per-request via ?forecast_days=N)
  DEFAULT_FORECAST_DAYS: "7"

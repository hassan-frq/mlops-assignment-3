# k8s/deployment.yaml — Kubernetes Deployment for the BTC-USD forecast API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast-api
  labels:
    app: btc-forecast
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: btc-forecast
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: btc-forecast
        component: api
    spec:
      # ----------------------------------------------------------------
      # Security context — run as the non-root user created in Dockerfile
      # ----------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999

      containers:
        - name: api
          # Replace with your actual registry / image tag after CI/CD push.
          image: ghcr.io/hassan-frq/mlops-assignment-3/btc-forecast-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

          # ----------------------------------------------------------------
          # Environment — sourced from ConfigMap (non-sensitive) and Secret
          # ----------------------------------------------------------------
          envFrom:
            - configMapRef:
                name: btc-forecast-config
            - secretRef:
                name: btc-forecast-secret

          # Downward-API additions not in the ConfigMap
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ----------------------------------------------------------------
          # Probes
          # ----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # ----------------------------------------------------------------
          # Resources  (memory limit raised to 512 Mi per assignment spec)
          # ----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ----------------------------------------------------------------
          # Shared model volume
          # ----------------------------------------------------------------
          volumeMounts:
            - name: model-store
              mountPath: /app/models
              readOnly: false          # Training job writes here via the same PVC

      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: model-store
